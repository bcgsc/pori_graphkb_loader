[project]
name = "pori-graphkb-loader"
version = "0.1.0"
description = "Python loaders for importing external knowledge sources into GraphKB"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<4.0"

dependencies = [
    "pori-python>=1.5,<2",
]


# ---------------------------------------------------------------------------
# Optional loaders
#
# User-facing loader/extra names use hyphens:
#
#   poetry install -E fda-approvals
#   graphkb-loader fda-approvals fetch_data
#
# Python package names use underscores:
#
#   import fda_approvals
# ---------------------------------------------------------------------------

[project.optional-dependencies]
oncotree = []

fda-approvals = [
    "fda-approvals>=0.1.0,<0.2.0",
]


# ---------------------------------------------------------------------------
# CLI
# ---------------------------------------------------------------------------

[project.scripts]
graphkb-loader = "pori_graphkb_loader.cli:main"


# ---------------------------------------------------------------------------
# Poetry
# ---------------------------------------------------------------------------

[tool.poetry]
requires-poetry = ">=2.0"

packages = [
    { include = "pori_graphkb_loader", from = "src" },
]


# The fda-approvals distribution is maintained as its own package in this
# repository. Poetry resolves it from this local path when the fda-approvals
# extra is selected.
#
# Its Python import package is `fda_approvals`.

[tool.poetry.dependencies.fda-approvals]
path = "src/pori_graphkb_loader/loaders/fda_approvals"
optional = true
develop = true


# ---------------------------------------------------------------------------
# Development dependencies
# ---------------------------------------------------------------------------

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^6.0"
ruff = "^0.13"
mypy = "^1.0"


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = [
    "pori_graphkb_loader",
]


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pori_graphkb_loader"]


# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
